contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - busybox
    - ca-certificates-bundle
    - tini
    - curl
    - openssl
    - dex-k8s-authenticator

entrypoint:
  command: /usr/bin/tini -- /app/entrypoint.sh

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

work-dir: /app

paths:
  - path: /certs
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
