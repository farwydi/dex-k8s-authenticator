name: "Build and Push OCI Image"

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup melange
        uses: chainguard-dev/actions/setup-melange@main

      - name: Install apko
        run: |
          curl -fsSL https://github.com/chainguard-dev/apko/releases/latest/download/apko_linux_amd64 -o /usr/local/bin/apko
          chmod +x /usr/local/bin/apko

      - name: Generate signing key
        run: melange keygen

      - name: Build packages (amd64)
        run: |
          melange build melange.yaml \
            --arch x86_64 \
            --signing-key melange.rsa \
            --out-dir packages \
            --runner docker

      - name: Build packages (arm64)
        run: |
          melange build melange.yaml \
            --arch aarch64 \
            --signing-key melange.rsa \
            --out-dir packages \
            --runner docker

      - name: Determine tags
        id: tags
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          MINOR=${VERSION%.*}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "minor=${MINOR}" >> "$GITHUB_OUTPUT"

      - name: Publish image
        run: |
          apko publish apko.yaml \
            ${{ env.REGISTRY_IMAGE }}:${{ steps.tags.outputs.version }} \
            --arch x86_64,aarch64 \
            --keyring-append melange.rsa.pub \
            --repository-append ${{ github.workspace }}/packages

      - name: Tag additional versions
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY_IMAGE }}:${{ steps.tags.outputs.minor }} \
            --tag ${{ env.REGISTRY_IMAGE }}:latest \
            ${{ env.REGISTRY_IMAGE }}:${{ steps.tags.outputs.version }}
