package:
  name: dex-k8s-authenticator
  version: 1.0.0
  epoch: 0
  description: Dex Kubernetes Authenticator
  copyright:
    - license: Apache-2.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go
      - build-base

pipeline:
  - uses: go/build
    with:
      packages: .
      output: dex-k8s-authenticator

  - runs: |
      mkdir -p ${{targets.destdir}}/app
      cp -r html ${{targets.destdir}}/app/html
      cp -r templates ${{targets.destdir}}/app/templates
      cp entrypoint.sh ${{targets.destdir}}/app/entrypoint.sh
      chmod a+x ${{targets.destdir}}/app/entrypoint.sh
